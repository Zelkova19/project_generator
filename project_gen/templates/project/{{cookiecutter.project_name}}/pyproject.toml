[tool.poetry]
name = "register-service"
version = "0.1.0"
description = ""
authors =  ["zelkova <cohiba666@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12.7"
pytest = "^8.4.2"
allure-pytest = "^2.15.0"
faker = "^37.6.0"
pydantic = "^2.11.7"
pyhamcrest = "^2.1.0"
pytest-telegram-notifier = "^1.4.0"
telebot = "^0.0.5"
vyper-config = "^1.2.1"
marshmallow = "^4.0.1,"
pyyaml = "^6.0.2"
structlog = "^25.4.0"
toml = "^0.10.2"
watchdog = "^6.0.0"
six = "^1.17.0"
httpx = "^0.28.1"
pytest-asyncio = "^1.1.0"
curlify2 = "^2.0.0"
requests = "^2.32.5"
types-requests = "^2.32.4.20250913"
restcodegen = "^1.1.1"
restclient = "^0.11.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
addopts = """
        --alluredir=../allure-results
"""
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.poetry.group.lint.dependencies]
ruff = "^0.13.0"
mypy = "^1.18.2"

[tool.ruff]
line-length = 120
